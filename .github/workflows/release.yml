# Builds the Windows app and attaches it to a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v3.0.0 && git push origin v3.0.0
name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build portable app and installer
        run: python scripts/build.py --installer

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiVideoJoiner-windows
          path: |
            dist/MultiVideoJoiner-Setup.exe
            dist/MultiVideoJoiner.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MultiVideoJoiner-Setup.exe
            dist/MultiVideoJoiner.exe
          generate_release_notes: true
